name: Workspace authorization and persistence
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build --workspace functions
      - run: npx playwright install --with-deps chromium
      - name: Verify real callable authentication, tenant isolation and transactions
        run: npx --yes firebase-tools@15.36.0 emulators:exec --only auth,firestore,functions --project demo-esta-workspace --config firebase.workspace-test.json 'node --test tests/workspace/integration.mjs && node tests/workspace/browser.mjs'
