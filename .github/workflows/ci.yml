name: ESTA-Logic — Verify & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: '--max-old-space-size=4096'
  NX_DAEMON: 'false'
  VERCEL_ORG_ID: 'team_IKgL6dN47vKTwgnMR5TLyVKs'
  VERCEL_PROJECT_ID: 'prj_TGjrQisZaxQ1v26bRBm2cPhhkNTc'

jobs:
  lockfile-verify:
    name: Verify Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate lockfile
        run: |
          test -f package-lock.json
          npm ci --dry-run
          npm ci
          npm install --package-lock-only
          git diff --exit-code package-lock.json

  test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    needs: lockfile-verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Validate configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
          npm run validate:vercel
      - name: Validate workspace
        run: npx nx graph --file=/tmp/nx-graph.json
      - name: Lint frontend
        run: npx nx lint frontend
      - name: Check product claims
        run: npm run check:claims
      - name: Test public health monitor
        run: node --test scripts/public-health-monitor.test.mjs
      - name: Run frontend unit tests
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npx nx test frontend -- --run --coverage --passWithNoTests
      - name: Build production frontend
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npx nx build frontend

  e2e:
    name: Public Product E2E
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public Calculation Lab and Workspace Demo tests
        env:
          SKIP_AUTH_SETUP: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npx playwright test e2e/calculation-lab.spec.ts e2e/workspace-demo.spec.ts
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

# Deployments are managed by the Vercel Git integration for the reviewed
# Michiganman2353/ESTA-Logic repository. GitHub Actions validates source code,
# while Vercel creates branch previews and deploys the production branch.
# This intentionally avoids duplicate releases, unpinned CLI installations,
# unnecessary VERCEL_TOKEN exposure, and PR code running with deploy credentials.
