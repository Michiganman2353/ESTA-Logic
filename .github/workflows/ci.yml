name: ESTA Tracker CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: '--max-old-space-size=4096'
  NX_DAEMON: 'false'
  VERCEL_ORG_ID: 'team_IKgL6dN47vKTwgnMR5TLyVKs'
  VERCEL_PROJECT_ID: 'prj_TGjrQisZaxQ1v26bRBm2cPhhkNTc'
  VERCEL_SCOPE: 'esta-pro-projects'

jobs:
  lockfile-verify:
    name: Verify Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate lockfile
        run: |
          test -f package-lock.json
          npm ci --dry-run
          npm ci
          npm install --package-lock-only
          git diff --exit-code package-lock.json

  test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    needs: lockfile-verify
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Validate configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
          npm run validate:vercel
      - name: Validate workspace
        run: npx nx graph --file=/tmp/nx-graph.json
      - name: Lint frontend
        run: npx nx lint frontend
      - name: Check product claims
        run: npm run check:claims
      - name: Run frontend unit tests
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npx nx test frontend -- --run --coverage --passWithNoTests
      - name: Build production frontend
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npx nx build frontend

  e2e:
    name: Public Product E2E
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public Calculation Lab tests
        env:
          SKIP_AUTH_SETUP: 'true'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npx playwright test e2e/calculation-lab.spec.ts
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [test, e2e]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Validate Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"
      - name: Link and hydrate Vercel preview environment
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=preview --scope="$VERCEL_SCOPE" --token='${{ secrets.VERCEL_TOKEN }}'
      - name: Build and deploy preview
        id: deploy
        run: |
          vercel build --scope="$VERCEL_SCOPE" --token='${{ secrets.VERCEL_TOKEN }}'
          url=$(vercel deploy --prebuilt --scope="$VERCEL_SCOPE" --token='${{ secrets.VERCEL_TOKEN }}')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test preview
        run: |
          sleep 10
          curl --fail --location '${{ steps.deploy.outputs.url }}' >/tmp/preview.html
          grep -qi '<html' /tmp/preview.html

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Validate Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"
      - name: Link and hydrate Vercel production environment
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token='${{ secrets.VERCEL_TOKEN }}'
      - name: Build and deploy production
        id: deploy
        run: |
          vercel build --prod --scope="$VERCEL_SCOPE" --token='${{ secrets.VERCEL_TOKEN }}'
          url=$(vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token='${{ secrets.VERCEL_TOKEN }}')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test production
        run: |
          sleep 15
          curl --fail --location '${{ steps.deploy.outputs.url }}' >/tmp/production.html
          grep -qi '<html' /tmp/production.html
